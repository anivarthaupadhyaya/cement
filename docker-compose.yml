# Development database only. Production runs PostgreSQL natively on the shop PC.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cement
      POSTGRES_PASSWORD: cement
      POSTGRES_DB: cement
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cement"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
